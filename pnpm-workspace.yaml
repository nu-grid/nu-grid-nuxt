shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - nuxt-component-meta
  # 6.3.1 is the July 2023 security backport to the 6.x line, published by an npm CLI maintainer
  # without provenance after 7.5.2 shipped with it; pnpm reads that date order as a downgrade.
  - semver@6.3.1

# Exact versions published on 22 Sep 2026, the day nu-grid bumped every dependency and moved to
# pnpm 12 (whose 1-day release-age check is on by default). Exempted so 0.4.0 could publish the
# same day. Pinned versions only: anything newer still waits out the age check. Safe to delete
# from 24 Sep 2026 onwards.
minimumReleaseAgeExclude:
  - '@iconify-json/lucide@1.2.136'
  - '@iconify-json/vscode-icons@1.2.80'
  - '@iconify/collections@1.0.740'
  - '@nuxt/ui@4.11.2'
  - electron-to-chromium@1.5.434
  - eslint-plugin-oxlint@1.85.0
  - eslint-plugin-perfectionist@5.12.0
  - framer-motion@13.4.1
  - ignore@7.0.10
  - motion-dom@13.4.1
  - satori@0.33.5
  - undici@8.11.0

# Was shamefully-hoist=true in .npmrc; pnpm 11+ reads settings from this file.
shamefullyHoist: true

packages:
  - ./
  - docs
  - playgrounds/nuxt

catalog:
  eslint-plugin-oxlint: ^1.85.0
  eslint-plugin-perfectionist: ^5.12.0
  '@iconify-json/lucide': ^1.2.136
  '@iconify-json/simple-icons': ^1.2.97
  '@iconify-json/vscode-icons': ^1.2.80
  '@nuxt/content': ^3.16.1
  '@nuxt/devtools': ^3.4.2
  '@nuxt/fonts': ^0.14.0
  '@resvg/resvg-js': ^2.6.2
  '@nuxt/eslint': ^1.17.0
  '@nuxt/image': ^2.1.0
  '@nuxt/kit': ^4.5.2
  '@nuxt/module-builder': ^1.0.3
  '@nuxt/schema': ^4.5.2
  '@nuxt/test-utils': ^4.3.2
  '@nuxt/ui': ^4.11.2
  '@tanstack/vue-virtual': ^3.13.39
  '@playwright/test': ^1.63.0
  '@types/node': ^25.9.6
  '@vitest/ui': ^5.0.1
  '@vue/test-utils': ^2.5.1
  '@vueuse/nuxt': ^14.4.0
  better-sqlite3: ^13.0.3
  defu: ^6.1.7
  eslint: ^10.11.0
  oxlint: ^1.85.0
  oxfmt: ^0.70.0
  happy-dom: ^20.14.5
  nuxt: ^4.5.2
  nuxt-component-meta: ^0.18.0
  nuxt-og-image: ^6.8.0
  prettier: ^3.9.8
  satori: ^0.33.5
  scule: ^1.3.0
  shiki-stream: ^0.1.5
  shiki-transformer-color-highlight: ^1.1.0
  sortablejs: ^1.15.7
  tailwind-scrollbar: ^4.0.2
  tailwindcss: ^4.3.3
  vue: ^3.5.43
  typescript: ^5.9.3
  vitest: ^5.0.1
  vue-tsc: ^3.3.11
  zod: ^4.6.5
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  maplibre-gl: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
peerDependencyRules:
  ignoreMissing:
    - '@tiptap/*'
